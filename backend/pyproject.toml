[project]
name = "voice-companion-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "anthropic>=0.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
memory = ["mem0ai>=0.1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
